<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les sons du français · 音檔</title>
<style>
  :root {
    --dark: #2F2A24; --cream: #F6EFE3; --card: #FBF7F0; --sand: #EBDDC6; --line: #E3D2B6;
    --orange: #D2733A; --rust: #A9531F; --olive: #6E7543; --oliveD: #565C32; --peach: #F7DFCB; --oliveL: #E4E6CF; --gray: #6B6157;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--dark);
    font-family: "Inter", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  header { background: var(--dark); color: var(--cream); padding: 22px 20px 18px; }
  .kicker { font-size: 11px; letter-spacing: .18em; color: #D9C7AA; font-weight: 700; text-transform: uppercase; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: 26px; margin: 6px 0 2px; }
  h1 span { color: var(--orange); }
  .sub { color: #D9C7AA; font-size: 14px; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 40px; }
  .controls { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; font: inherit; font-size: 14px; color: var(--dark); cursor: pointer; }
  .seg button.on { background: var(--orange); color: #fff; font-weight: 700; }
  label.small { font-size: 13px; color: var(--gray); }
  select { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: #fff; max-width: 100%; }
  .warn { display: none; margin-top: 10px; background: var(--peach); color: var(--rust); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  h2 { display: flex; align-items: center; gap: 10px; margin: 24px 0 10px; font-size: 18px; }
  h2 .chip { background: var(--orange); color: #fff; font-size: 11px; letter-spacing: .12em; font-weight: 800; padding: 4px 10px; border-radius: 6px; }
  h2 small { color: var(--gray); font-weight: 400; font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .item { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
  .item:active { transform: scale(.99); }
  .item.playing { border-color: var(--orange); background: #fff; }
  .num { flex: none; min-width: 26px; height: 26px; padding: 0 5px; border-radius: 13px; background: var(--orange); color: #fff; font-size: 13px; font-weight: 800; display: grid; place-items: center; }
  .play { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--dark); display: grid; place-items: center; }
  .play svg { width: 16px; height: 16px; fill: var(--cream); margin-left: 2px; }
  .item.playing .play { background: var(--orange); }
  .txt { flex: 1; min-width: 0; }
  .fr { font-weight: 700; font-size: 17px; }
  .zh { font-size: 12px; color: var(--gray); margin-top: 2px; }
  .phrases .grid { grid-template-columns: 1fr; }
  .phrases .fr { font-size: 16px; }
  .reveal { margin-top: 26px; text-align: center; }
  .reveal button { border: 1px dashed var(--orange); background: transparent; color: var(--rust); border-radius: 999px; padding: 8px 18px; font: inherit; font-size: 14px; cursor: pointer; }
  .ipa { display: none; color: var(--rust); font-size: 13px; font-weight: 600; margin-left: 6px; }
  body.show-ipa .ipa { display: inline; }
  footer { text-align: center; font-size: 12px; color: var(--gray); margin-top: 26px; line-height: 1.7; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 23px; } }
</style>
</head>
<body>
<header>
  <div class="kicker">French Pronunciation · Fiche d’exercices</div>
  <h1>Les sons <span>du français</span></h1>
  <div class="sub">學習單音檔：點一下就會播放</div>
</header>
<main>
  <div class="controls">
    <div class="seg" role="group" aria-label="Vitesse">
      <button type="button" data-rate="0.9" class="on">Normal 正常</button>
      <button type="button" data-rate="0.6">Lent 慢速</button>
    </div>
    <label class="small" for="voice">Voix 聲音</label>
    <select id="voice"></select>
  </div>
  <div class="warn" id="warn">這台裝置找不到法文語音。請在手機或電腦的「設定 → 語言／文字轉語音」加入法文（Français）語音後重新整理；iPhone 請確認沒有開啟靜音。</div>

  <section>
    <h2><span class="chip">EXERCICE 1</span> Écrivez l’API <small>寫出音標</small></h2>
    <div class="grid" id="mots"></div>
  </section>

  <section>
    <h2><span class="chip">EXERCICE 2</span> Combien de syllabes ? <small>數音節</small></h2>
    <div class="grid" id="syl"></div>
  </section>

  <section class="phrases">
    <h2><span class="chip">EXERCICE 3</span> L’intonation <small>畫出語調</small></h2>
    <div class="grid" id="phrases"></div>
  </section>

  <footer>Les sons du français · Prononciation A0–A1</footer>
</main>
<script>
const MOTS = [
  ["bonjour", "你好"], ["merci", "謝謝"], ["fromage", "起司"], ["gâteau", "蛋糕"],
  ["voiture", "汽車"], ["fenêtre", "窗戶"], ["cheveux", "頭髮"], ["sœur", "姊妹"],
  ["maison", "房子"], ["enfant", "小孩"], ["jardin", "花園"], ["montagne", "山"],
  ["cinéma", "電影院"], ["guitare", "吉他"], ["quatorze", "十四"], ["poisson", "魚"],
];
const SYL = [
  ["chat", "貓"], ["merci", "謝謝"], ["bonjour", "你好"], ["chocolat", "巧克力"], ["éléphant", "大象"], ["restaurant", "餐廳"],
  ["oiseau", "鳥"], ["université", "大學"], ["pain", "麵包"], ["télévision", "電視"], ["ordinateur", "電腦"], ["croissant", "可頌"],
];
const PHRASES = [
  ["Bonjour, je m’appelle Léa.", "你好，我叫 Léa。"],
  ["Tu aimes le chocolat ?", "你喜歡巧克力嗎？"],
  ["Où est la boulangerie ?", "麵包店在哪裡？"],
  ["Le matin, je bois un café.", "早上我喝一杯咖啡。"],
  ["Vous voulez du fromage ou du pain ?", "您要起司還是麵包？"],
  ["Il y a quatorze poissons dans le lac.", "湖裡有十四條魚。"],
  ["Mon oncle a un grand jardin à la campagne.", "我叔叔在鄉下有一個大花園。"],
  ["Le week-end, je vais à la montagne avec ma sœur.", "週末我和姊姊去山上。"],
];
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>';
let rate = 0.9, voices = [], current = null;

function card(n, fr, zh, ipa) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "item";
  b.innerHTML = `<span class="num">${n}</span><span class="txt"><div class="fr">${fr}</div><div class="zh">${zh}</div></span><span class="play">${PLAY}</span>`;
  b.addEventListener("click", () => speak(fr, b));
  return b;
}
MOTS.forEach(([fr, zh], i) => document.getElementById("mots").appendChild(card(i + 1, fr, zh)));
SYL.forEach(([fr, zh], i) => document.getElementById("syl").appendChild(card("S" + (i + 1), fr, zh)));
PHRASES.forEach(([fr, zh], i) => document.getElementById("phrases").appendChild(card("P" + (i + 1), fr, zh)));

function score(v) {
  const n = v.name.toLowerCase(); let s = 0;
  if (/fr[-_]fr/i.test(v.lang)) s += 5;
  if (/natural|neural|premium|enhanced|online/.test(n)) s += 6;
  if (/google/.test(n)) s += 4;
  if (/amélie|amelie|thomas|audrey|aurélie|aurelie|denise|henri|vivienne|remy|marie/.test(n)) s += 2;
  return s;
}
function loadVoices() {
  if (!("speechSynthesis" in window)) { document.getElementById("warn").style.display = "block"; return; }
  voices = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang)).sort((a, b) => score(b) - score(a));
  const sel = document.getElementById("voice");
  const prev = sel.value;
  sel.innerHTML = "";
  voices.forEach((v, i) => { const o = document.createElement("option"); o.value = i; o.textContent = `${v.name} (${v.lang})`; sel.appendChild(o); });
  if (prev && voices[prev]) sel.value = prev;
  document.getElementById("warn").style.display = voices.length ? "none" : "block";
}
if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 600);
} else { loadVoices(); }

function speak(text, el) {
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/’/g, "'"));
    const v = voices[document.getElementById("voice").value];
    if (v) u.voice = v;
    u.lang = v ? v.lang : "fr-FR";
    u.rate = rate;
    if (current) current.classList.remove("playing");
    current = el; el.classList.add("playing");
    u.onend = u.onerror = () => el.classList.remove("playing");
    speechSynthesis.speak(u);
  } catch (e) { document.getElementById("warn").style.display = "block"; }
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".seg button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); rate = parseFloat(b.dataset.rate);
}));
</script>
</body>
</html>
